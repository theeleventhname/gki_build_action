name: Build Xaga Sukisu Kernel

on:
  workflow_dispatch:

    inputs:
      KERNEL_SOURCE:
        description: 'Kernel Source'
        required: true
        default: 'xiaomi-mt6895-devs/android_kernel_xiaomi_mt6895'
      KERNEL_SOURCE_BRANCH:
        description: 'Branch'
        required: true
        default: 'lineage-23.0'      
      SUSFS_SOURCE:
        description: 'Susfs Source'
        required: true
        default: 'ShirkNeko/susfs4ksu'
      SUSFS_SOURCE_BRANCH:
        description: 'Branch'
        required: true
        default: 'gki-android12-5.10'
      ENABLE_KPM:
        description: 'KPM OPTION'
        required: true
        default: 'false'
      ENABLE_VFS:
        description: 'VFS OPTION'
        required: false
        default: 'true'
      TEMP_OPTION:
        description: 'Kernel untested'
        required: false
        default: 'false'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
          fetch-depth: 0

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
          swap-size-gb: 20
          
    - name: Setup Configuration
      run: |
        echo "KERNEL_SOURCE=${{ github.event.inputs.KERNEL_SOURCE }}" >> $GITHUB_ENV
        echo "KERNEL_SOURCE_BRANCH=${{ github.event.inputs.KERNEL_SOURCE_BRANCH }}" >> $GITHUB_ENV
        echo "SUSFS_SOURCE=${{ github.event.inputs.SUSFS_SOURCE }}" >> $GITHUB_ENV
        echo "SUSFS_SOURCE_BRANCH=${{ github.event.inputs.SUSFS_SOURCE_BRANCH }}" >> $GITHUB_ENV
        echo "ENABLE_KPM=${{ github.event.inputs.ENABLE_KPM }}" >> $GITHUB_ENV
        echo "ENABLE_VFS=${{ github.event.inputs.ENABLE_VFS }}" >> $GITHUB_ENV
        echo "TEMP_OPTION=${{ github.event.inputs.TEMP_OPTION }}" >> $GITHUB_ENV

    
    - name: Setup build kernel environment
      run: |
        echo "BUILD_TIME=$(TZ=Asia/Shanghai date "+%Y%m%d%H%M")" >> $GITHUB_ENV
        sudo apt-get update
        sudo apt-get install git flex lzop bison make libssl-dev python3 python-is-python3 libncurses-dev dos2unix



    - name: Download Clang Toolchain
      run: |
        git clone --depth 1 https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b clang

    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        github-server-url: 'https://github.com'
        repository: ${{ env.KERNEL_SOURCE }}
        ref: ${{ env.KERNEL_SOURCE_BRANCH }}
        path: project
        submodules: recursive
        fetch-depth: 1

    - name: Checkout Susfs Source
      uses: actions/checkout@v4
      with:
        github-server-url: 'https://github.com'
        repository: ${{ env.SUSFS_SOURCE }}
        ref: ${{ env.SUSFS_SOURCE_BRANCH }}
        path: susfs
        submodules: recursive
        fetch-depth: 1
            
    - name: Setup Patches
      run: |
        cd project
        curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s tmp-builtin
        cp ${GITHUB_WORKSPACE}/susfs/kernel_patches/fs/* ./fs/
        cp ${GITHUB_WORKSPACE}/susfs/kernel_patches/include/linux/* ./include/linux/
        cp ${GITHUB_WORKSPACE}/susfs/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch ./
        sed -i 's/drivers\/input\/misc\/aw8697_haptic\/Kconfig/drivers\/input\/misc\/aw8697_haptic\/Kconfig\"/g' drivers/input/misc/Kconfig
        sed -i 's/drivers\/input\/misc\/aw8624_haptic\/Kconfig/drivers\/input\/misc\/aw8624_haptic\/Kconfig\"/g' drivers/input/misc/Kconfig
        dos2unix drivers/input/touchscreen/goodix_9916/Kconfig
        sed -i 's/-dirty//g' scripts/setlocalversion
        patch -p1 < 50_add_susfs_in_gki-android12-5.10.patch
        echo -e "CONFIG_KSU=y \n# CONFIG_KSU_DEBUG is not set \n# CONFIG_KSU_ALLOWLIST_WORKAROUND is not set \nCONFIG_KSU_SUSFS=y \nCONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y \nCONFIG_KSU_SUSFS_SUS_SU=y \nCONFIG_KSU_SUSFS_SUS_PATH=y \nCONFIG_KSU_SUSFS_SUS_MAP=y \nCONFIG_KSU_SUSFS_SUS_MOUNT=y \nCONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y \nCONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y \nCONFIG_KSU_SUSFS_SUS_KSTAT=y \n# CONFIG_KSU_SUSFS_SUS_OVERLAYFS is not set \nCONFIG_KSU_SUSFS_TRY_UMOUNT=y \nCONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y \nCONFIG_KSU_SUSFS_SPOOF_UNAME=y \nCONFIG_KSU_SUSFS_ENABLE_LOG=y \nCONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y \nCONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y \nCONFIG_KSU_SUSFS_OPEN_REDIRECT=y \n# gki  needs enable kprobes \nCONFIG_KSU_WITH_KPROBES=y \nCONFIG_HAVE_KPROBES=y \nCONFIG_KPROBE_EVENTS=y" >> arch/arm64/configs/gki_defconfig
    
    - name: Change kernel
      run: |      
        cd project
        if [[ "${{ env.TEMP_OPTION }}" == "true" ]];then
          sed -i '/^#define MIN(a, b) (((a) < (b)) ? (a) : (b))$/d' drivers/char/rpmb/rpmb-mtk.c
          sed -i '/^#define MIN(a, b)			((a) >= (b) ? (b) : (a))$/d' drivers/misc/mediatek/swpm/inc/swpm_module.h
          sed -i '/^#define MAX(a, b)			((a) >= (b) ? (a) : (b))$/d' drivers/misc/mediatek/swpm/inc/swpm_module.h
          sed -i '/^#define MIN(x, y)	((x) < (y) ? (x) : (y))$/d' drivers/gpu/mediatek/mali-valhall/gpu/arm/midgard/mali_malisw.h
          sed -i '/^#define MAX(x, y)	((x) < (y) ? (y) : (x))$/d' drivers/gpu/mediatek/mali-valhall/gpu/arm/midgard/mali_malisw.h
          sed -i '/^#define MIN(x, y) ((x) < (y) ? (x) : (y))$/d' drivers/input/misc/aw8697_haptic/ringbuffer.h
          sed -i '/^#define in_range(c, lo, up) ((int)c >= lo && (int)c <= up)$/d' drivers/misc/mediatek/connectivity/wlan/core/gen4m/include/nan/wpa_supp/FourWayHandShake.h
          sed -i '/^#define MIN(a, b) (((a) < (b)) ? (a) : (b))$/d' drivers/misc/mediatek/connectivity/bt/mt66xx/include/btmtk_define.h
          sed -i '/^#define MAX(a, b) (((a) > (b)) ? (a) : (b))$/d' drivers/misc/mediatek/connectivity/bt/mt66xx/include/btmtk_define.h
        fi

    - name: Setup Additional Option
      run: |
        cd project  
        if [[ "${{ env.ENABLE_KPM }}" == "true" ]];then
          echo -e "CONFIG_KPM=y" >> arch/arm64/configs/gki_defconfig
        fi
        
        
    - name: Build kernel
      run: |
        cd project
        export PATH=$GITHUB_WORKSPACE/clang/bin:$GITHUB_WORKSPACE/gcc/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        export CFLAGS="-mno-outline-atomics"
        export CXXFLAGS="-mno-outline-atomics"
        make O=out CC=clang ARCH=arm64 SUBARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-  CROSS_COMPILE_COMPAT=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1 gki_defconfig vendor/xiaomi_mt6895.config vendor/xaga.config
        make -j$(nproc --all) O=out CC=clang ARCH=arm64 SUBARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-  CROSS_COMPILE_COMPAT=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1 TARGET_BUILD_VARIANT=user

    - name: Apply config
      run: |
        cd /home/runner/work/gki_build_action/gki_build_action/project/out/arch/arm64/boot/
        if [[ "${{ env.ENABLE_KPM }}" == "true" ]];then
          curl -LO https://raw.githubusercontent.com/ShirkNeko/SukiSU_patch/refs/heads/main/kpm/patch_linux
          chmod +x patch_linux
          ./patch_linux
          rm -f Image
          mv oImage Image
        fi

    - name: Make AnyKernel3
      run: |
          git clone https://github.com/Kernel-SU/AnyKernel3.git --depth=1
          rm -rf ./AnyKernel3/.git
          mkdir -p kernel_workspace/kernel_platform/out/Final-Image-Find/
          image_path=$(find "/home/runner/work/gki_build_action/gki_build_action/project/out/arch/arm64/boot/" -name "Image" | head -n 1)
          if [ -n "$image_path" ]; then
            echo "使用 make 编译的统一路径，成功找到 Image 文件"
          else
            image_path=$(find "/home/runner/work/gki_build_action/gki_build_action/project/out/arch/arm64/boot/" -name "Image" | head -n 1)
            if [ -n "$image_path" ]; then
              echo "使用官方脚本编译，成功找到 Image 文件"
            else
              echo "未找到 Image 文件，构建失败" >&2
              exit 1
            fi
          fi
          if [ -n "$image_path" ] && [ -f "$image_path" ]; then
            echo "Image file finally located at: $image_path"
            cp "$image_path" ./AnyKernel3/Image
            cp "$image_path" kernel_workspace/kernel_platform/out/Final-Image-Find/Image
          fi

    - name: Upload ak3 kernel zip
      uses: actions/upload-artifact@v4
      with:
        name: xaga_sukisu+susfs-ak3_${{ env.BUILD_TIME}}
        path: |
          ./AnyKernel3/*
          
    - name: Upload the kernel zip
      uses: actions/upload-artifact@v4
      with:
        name: xaga_suskisu_${{ env.BUILD_TIME}}
        path: |
          /home/runner/work/gki_build_action/gki_build_action/project/out/arch/arm64/boot/Image
